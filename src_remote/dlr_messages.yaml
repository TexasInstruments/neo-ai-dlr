header : DLR_MESSAGES

dlr_create_model:
    comment: |
        DLR_DLL
        int CreateDLRModel(DLRModelHandle* handle, const char* model_path, int dev_type,
                           int dev_id);
    resp:
    - status: int32_t
    - id: uint32_t
    req:
    - model_path: std::string
    - dev_type: int32_t
    - dev_id: int32_t

dlr_delete_model:
    comment: |
        DLR_DLL
        int DeleteDLRModel(DLRModelHandle* handle);
    resp:
